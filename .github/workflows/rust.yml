name: Rust CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  playback-actor-platform-check:
    name: Playback actor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.0'

      - name: Check Lattice playback actor contracts
        run: cargo check -p stellatune-audio --tests

  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ['1.98.0']
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt

      - name: Rustfmt Check
        run: cargo fmt --all -- --check

      - name: Rust source file LOC check
        run: cargo run -p stellatune-xtask -- check-loc

      - name: Clippy Check
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rustdoc Check
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p stellatune-audio-core -p stellatune-audio --no-deps --document-private-items

      - name: Rustdoc Tests
        run: cargo test -p stellatune-audio-core -p stellatune-audio --doc

  netease-plugin-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.0'

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test shared TypeScript runtime
        run: cargo test -p stellatune-plugins --test typescript_runtime

      - name: Package plugin artifact
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File crates/plugins-native/stellatune-plugin-netease/scripts/package-windows.ps1 -OutDir dist

      - name: Verify packaged files
        shell: pwsh
        run: |
          $zip = Get-ChildItem crates/plugins-native/stellatune-plugin-netease/dist -Filter "*.zip" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $zip) { throw "packaged v2 zip not found" }
          $extractDir = Join-Path $env:RUNNER_TEMP "netease-plugin-smoke"
          if (Test-Path $extractDir) { Remove-Item -Recurse -Force $extractDir }
          Expand-Archive -Path $zip.FullName -DestinationPath $extractDir -Force
          if (-not (Test-Path (Join-Path $extractDir "manifest.json"))) {
            throw "missing manifest v2"
          }
          if (-not (Test-Path (Join-Path $extractDir "plugin.mjs"))) {
            throw "missing bundled TypeScript plugin"
          }
          if (Get-ChildItem $extractDir -Recurse -Include *.wasm,*.node,package.json) {
            throw "v2 package contains a forbidden runtime payload"
          }
