name: Flutter CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: apps/stellatune

      - name: Flutter Analyze
        run: flutter analyze
        working-directory: apps/stellatune

      - name: Flutter Build Check (Windows)
        run: flutter build windows --debug
        working-directory: apps/stellatune

      - name: Test bundled Node without system PATH
        shell: pwsh
        run: |
          $env:STELLATUNE_TEST_RUNTIME_DIR = "$PWD/apps/stellatune/build/windows/x64/runner/Debug/plugin-runtime"
          & "$env:STELLATUNE_TEST_RUNTIME_DIR/node.exe" --test tools/typescript-plugin-runtime/tests/bundle.test.mjs
