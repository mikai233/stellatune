[package]
name = "stellatune-asio-host"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
stellatune-asio-proto = { path = "../stellatune-asio-proto" }
ringbuf.workspace = true
memmap2.workspace = true

# Note: enabling cpal's `asio` feature can pull the Steinberg ASIO SDK at build time
# (depending on CPAL_ASIO_DIR / cache), and may require clang/bindgen.
cpal.workspace = true

[features]
default = []
asio = ["cpal/asio"]

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_System_Threading",
    "Win32_Foundation",
] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
